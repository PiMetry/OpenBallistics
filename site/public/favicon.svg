<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenBallistics">
  <!--
    There was no icon at all, so every visit asked the domain root for `/favicon.ico` - not this
    project's path - and logged the 404 it got in the console. A bottlenecked cartridge stood on
    its base, rather than the masthead's "OB": two letters are mush at 16 px and this shape is not,
    and it says what the site is about. Drawn, so it is a few hundred bytes and sharp at any size,
    and in the brass the drawings use, which reads on a light or a dark tab strip.
  -->
  <rect width="32" height="32" rx="6" fill="#1b1a18"/>
  <path fill="#c9a227" stroke="#f6f5f2" stroke-width="1.1" stroke-linejoin="round"
        d="M16 4.2l3.1 5.6v3.4l1.9 2.6v10.3q0 1.7-1.7 1.7h-6.6q-1.7 0-1.7-1.7V15.8l1.9-2.6V9.8z"/>
  <path stroke="#1b1a18" stroke-width="1.1" stroke-linecap="round" d="M11.4 24.3h9.2"/>
</svg>
