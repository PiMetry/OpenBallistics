name: Add a cartridge
description: Propose a cartridge the dataset does not carry yet.
title: "Add: "
labels: ["data", "new-cartridge"]
body:
  - type: markdown
    attributes:
      value: |
        One field per value, rather than a block of prose, so a submission can be checked against
        the schema automatically instead of being re-keyed by hand.

        **Give the source for every figure.** A dimension without a source cannot be verified, and
        this dataset's whole claim is that its numbers can be traced back to a published sheet.
  - type: input
    id: designation
    attributes:
      label: Designation
      description: As the standard spells it, e.g. `9 mm Luger`, `7,62 x 39`.
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Case family
      options: [rimless, rimmed, belted, pistol, rimfire, shotshell]
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: >
        Which published sheet these come from, and its revision date. "C.I.P. TDCC, Tab I,
        revised 2008-09-23" is ideal.
    validations:
      required: true
  - type: textarea
    id: cartridge
    attributes:
      label: Cartridge dimensions
      description: >
        One `field = value` per line, using the names the sheet prints — `L3 = 51.18`,
        `P1 = 11.96`, `R1 = 12.01`. Leave out anything the sheet does not state; a blank is
        information, and a guess is not.
      render: text
    validations:
      required: true
  - type: textarea
    id: chamber
    attributes:
      label: Chamber dimensions
      description: The same, for the chamber side of the sheet. Leave empty if you do not have it.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Alternative names, country of origin, or anything about the sheet worth knowing.
