name: Verify a record against its source
description: Confirm one part of a record - its cartridge or chamber numbers, either drawing, or the bullet - against a published source.
title: "Verify: "
labels: [verification]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for checking a record against its source. A verification report should say what
        you checked, which source you used, and whether it agrees.

        **One facet per report.** A record is verified in five separate parts and they are
        confirmed at different times by different people, so a report that covers one of them can
        be acted on and a report that claims all five cannot be checked. Open another for the next
        one.

        If you arrived here from the site, the cartridge, the facet and the page link are already
        filled in.
  - type: input
    id: cartridge
    attributes:
      label: Cartridge
      description: Its name and key, e.g. `308 Win. (308_win)`.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: What did you verify?
      description: >
        The published dimensions of the cartridge or of the chamber, the drawing of either, or the
        nose form of the bullet the cartridge drawing puts in the case mouth.
      options:
        - cartridge
        - chamber
        - cartridge drawing
        - chamber drawing
        - bullet
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Does it agree with the source?
      description: >
        The vote itself. Three readers agreeing marks that facet verified on the site; a reader who
        finds it wrong is counted against it, so a facet carrying one disagreement needs a fourth
        reader to agree before it is marked. Close your own issue to withdraw your vote.
      options:
        - It agrees with the source
        - It does not agree with the source
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Verification result
      description: >
        Say what you checked and whether the record or the drawing agrees with the source. If it
        does not, say where it differs; that is a correction as well as a verification, and both
        are useful.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: The C.I.P. sheet, revision date, or other source used for the check.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The page you were looking at.
