name: Promote verified records

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: promote-verifications
  cancel-in-progress: true

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect open verification issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --repo "$GITHUB_REPOSITORY" --state open --label verification --limit 1000 --json number,author,body,url > verification-issues.json

      - name: Promote records with three confirmations
        run: node src/scripts/promote-verifications.mjs verification-issues.json verification-pr.md

      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No record reached the verification threshold."
            exit 0
          fi
          branch="automation/verification-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add belted pistol rimfire rimless rimmed shotshell
          git commit -m "Mark records verified after three confirmations"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Mark records verified after three confirmations" \
            --body-file verification-pr.md
