name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a superseded run is cancelled rather than racing the one behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The site is one directory of this repository, not the whole of it: the dataset is the rest.
    # Everything below runs inside it; the paths that GitHub itself resolves -- the uploaded
    # artifact, the lockfile the cache keys off -- are given from the repository root, because
    # those are not shell commands. For this workflow to deploy, the repository's Pages source
    # must be "GitHub Actions" rather than the gh-pages branch.
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - run: npm ci

      # `base` has to match the Pages path or every hashed asset 404s -- the one thing that
      # reliably goes wrong first on a project page. Taking it from the repository name means a
      # fork deploys correctly without editing vite.config.ts. A user or organisation page is
      # served from the root, so it gets '/' instead.
      #
      # Note this is the *repository* name, not the site's directory: the site is served from the
      # root of the Pages deployment regardless of living in `browser/` here, because the workflow
      # uploads `browser/dist` as the whole artifact.
      - name: Resolve the Pages base path
        id: base
        run: |
          # Reads only environment variables; the working directory is irrelevant here.
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo" = "$owner.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          PAGES_BASE: ${{ steps.base.outputs.path }}
          # So the "something look wrong?" links report to whichever repository built the site,
          # rather than to whoever it was forked from. Unset, the links are not rendered at all.
          VITE_REPO: ${{ github.repository }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
